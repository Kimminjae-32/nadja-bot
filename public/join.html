<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내전 참가 신청</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --border: #2a2a4a;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #e0e0f0;
            --muted: #8888aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container { width: 100%; max-width: 480px; }
        h1 { font-size: 1.6rem; margin-bottom: .3rem; }
        .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 1.8rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .field { margin-bottom: 1.4rem; }
        .field:last-child { margin-bottom: 0; }
        label {
            display: block;
            font-size: .8rem;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: .45rem;
        }
        input[type="text"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: .75rem 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        .positions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .5rem;
        }
        .tiers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .4rem;
        }
        .pos-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: .7rem .5rem;
            cursor: pointer;
            text-align: center;
            transition: border-color .15s, background .15s;
            font-size: .9rem;
            line-height: 1.3;
        }
        .tier-btn { font-size: .8rem; padding: .5rem .3rem; }
        .pos-icon { width: 36px; height: 36px; display: block; margin: 0 auto .2rem; object-fit: contain; }
        .tier-icon { width: 32px; height: 32px; display: block; margin: 0 auto .15rem; object-fit: contain; }
        .pos-btn:hover { border-color: var(--accent); }
        .pos-btn.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: .9rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s;
            margin-top: 1.2rem;
        }
        .submit-btn:hover { opacity: .85; }
        .submit-btn:disabled { opacity: .45; cursor: not-allowed; }
        .err { color: var(--accent); font-size: .85rem; margin-top: .6rem; display: none; }
        .success {
            background: #122212;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            display: none;
        }
        .success h2 { color: #4caf50; margin-bottom: .75rem; }
        .success p { color: var(--muted); margin-bottom: 1.2rem; }
        .manage-link {
            display: inline-block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .7rem 1.5rem;
            color: var(--text);
            text-decoration: none;
            font-size: .9rem;
            transition: border-color .2s;
        }
        .manage-link:hover { border-color: var(--accent); color: var(--accent); }
        .rule-box { background: rgba(233,69,96,.08); border: 1px solid var(--accent); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
        .rule-box h3 { font-size: .85rem; color: var(--accent); margin-bottom: .4rem; letter-spacing: .04em; }
        .rule-text { font-size: .9rem; white-space: pre-wrap; line-height: 1.6; }
        .char-search { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:.5rem .75rem; font-size:.85rem; outline:none; margin-bottom:.5rem; transition:border-color .2s; box-sizing:border-box; }
        .char-search:focus { border-color:var(--accent); }
        .char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:.3rem; max-height:200px; overflow-y:auto; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.5rem; }
        .char-pick { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:.3rem .4rem; font-size:.78rem; cursor:pointer; text-align:center; transition:border-color .1s, background .1s; user-select:none; }
        .char-pick:hover { border-color:var(--accent); }
        .char-pick.selected { background:var(--accent2); border-color:var(--accent); }
        .char-pick.maxed { opacity:.35; cursor:not-allowed; pointer-events:none; }
        .char-chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; min-height:1.6rem; align-items:center; }
        .char-chip { display:inline-flex; align-items:center; gap:.3rem; background:#0a1a2a; border:1px solid var(--accent); border-radius:20px; padding:.25rem .65rem; font-size:.82rem; color:var(--text); }
        .char-chip-x { cursor:pointer; opacity:.7; line-height:1; font-size:.9rem; color:var(--accent); }
        .char-chip-x:hover { opacity:1; }
        .char-hint { font-size:.78rem; color:var(--muted); margin-top:.35rem; }
        .nick-row { display:flex; gap:.4rem; }
        .nick-row input { flex:1; }
        .lookup-btn { flex-shrink:0; background:var(--accent2); border:1px solid var(--accent); border-radius:8px; color:#e0e0f0; padding:.75rem .9rem; font-size:.88rem; cursor:pointer; white-space:nowrap; transition:opacity .2s; }
        .lookup-btn:hover { opacity:.85; }
        .lookup-btn:disabled { opacity:.4; cursor:not-allowed; }
        .mmr-result { font-size:.82rem; margin-top:.35rem; padding:.35rem .7rem; border-radius:6px; display:none; }
        .mmr-result.ok { background:rgba(76,175,80,.12); border:1px solid #4caf50; color:#90ee90; }
        .mmr-result.fail { background:rgba(233,69,96,.1); border:1px solid var(--accent); color:#ff9999; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="page-title">⚔️ 내전 참가 신청</h1>
    <p class="subtitle">아래 정보를 입력하고 참가 신청을 완료하세요.</p>

    <div id="rule-box" class="rule-box" style="display:none">
        <h3>📋 내전 룰</h3>
        <div class="rule-text" id="rule-text"></div>
    </div>

    <div id="form-wrap">
        <div class="card">
            <div class="field">
                <label for="dn">디스코드 닉네임</label>
                <input type="text" id="dn" placeholder="디스코드 표시 이름" autocomplete="off">
            </div>
            <div class="field">
                <label for="in">인게임 닉네임</label>
                <div class="nick-row">
                    <input type="text" id="in" placeholder="이터널 리턴 인게임 닉네임" autocomplete="off">
                    <button type="button" class="lookup-btn" id="lookup-btn" onclick="lookupTier()">티어 조회</button>
                </div>
                <div class="mmr-result" id="mmr-result"></div>
            </div>
            <div class="field" id="tier-field">
                <label>현재 티어 <span style="color:var(--muted);font-weight:400;text-transform:none">(선택)</span></label>
                <div class="tiers">
                    <button type="button" class="pos-btn tier-btn" data-tier="언랭크">
                        <span style="font-size:1.4rem;display:block;margin-bottom:.1rem">⬜</span>언랭크
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="아이언">
                        <img src="https://cdn.dak.gg/er/images/tier/full/1.png" class="tier-icon" onerror="this.style.display='none'">아이언
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="브론즈">
                        <img src="https://cdn.dak.gg/er/images/tier/full/2.png" class="tier-icon" onerror="this.style.display='none'">브론즈
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="실버">
                        <img src="https://cdn.dak.gg/er/images/tier/full/3.png" class="tier-icon" onerror="this.style.display='none'">실버
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="골드">
                        <img src="https://cdn.dak.gg/er/images/tier/full/4.png" class="tier-icon" onerror="this.style.display='none'">골드
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="플래티넘">
                        <img src="https://cdn.dak.gg/er/images/tier/full/5.png" class="tier-icon" onerror="this.style.display='none'">플래티넘
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="다이아몬드">
                        <img src="https://cdn.dak.gg/er/images/tier/full/6.png" class="tier-icon" onerror="this.style.display='none'">다이아몬드
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="메테오라이트">
                        <img src="https://cdn.dak.gg/er/images/tier/full/63.png" class="tier-icon" onerror="this.style.display='none'">메테오라이트
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="미스릴">
                        <img src="https://cdn.dak.gg/er/images/tier/full/66.png" class="tier-icon" onerror="this.style.display='none'">미스릴
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="데미갓">
                        <img src="https://cdn.dak.gg/er/images/tier/full/7.png" class="tier-icon" onerror="this.style.display='none'">데미갓
                    </button>
                    <button type="button" class="pos-btn tier-btn" data-tier="이터니티">
                        <img src="https://cdn.dak.gg/er/images/tier/full/8.png" class="tier-icon" onerror="this.style.display='none'">이터니티
                    </button>
                </div>
            </div>
            <div class="field" id="char-field">
                <label>주 사용 실험체 <span style="color:var(--muted);font-weight:400;text-transform:none">(선택, 최대 3개)</span></label>
                <div class="char-chips" id="char-chips"><span style="color:var(--muted);font-size:.83rem">선택 없음</span></div>
                <button type="button" class="pos-btn" id="char-toggle-btn" style="width:100%;margin-top:.4rem;margin-bottom:0;padding:.5rem;font-size:.83rem" onclick="toggleCharPicker()">+ 실험체 선택</button>
                <div id="char-picker" style="display:none;margin-top:.4rem">
                    <input type="text" class="char-search" id="char-search" placeholder="실험체 이름 검색..." autocomplete="off">
                    <div class="char-grid" id="char-grid"></div>
                </div>
                <p class="char-hint" id="char-hint">최대 3개까지 선택할 수 있어요.</p>
            </div>
            <div class="field" id="position-field">
                <label>선호 포지션</label>
                <div class="positions">
                    <button type="button" class="pos-btn" data-pos="탱커"><img src="/icons/tank.png" class="pos-icon" onerror="this.style.display='none'">탱커</button>
                    <button type="button" class="pos-btn" data-pos="전사"><img src="/icons/warrior.png" class="pos-icon" onerror="this.style.display='none'">전사</button>
                    <button type="button" class="pos-btn" data-pos="암살자"><img src="/icons/assassin.png" class="pos-icon" onerror="this.style.display='none'">암살자</button>
                    <button type="button" class="pos-btn" data-pos="스킬 딜러"><img src="/icons/skill.png" class="pos-icon" onerror="this.style.display='none'">스킬 딜러</button>
                    <button type="button" class="pos-btn" data-pos="원거리 딜러"><img src="/icons/range.png" class="pos-icon" onerror="this.style.display='none'">원거리 딜러</button>
                    <button type="button" class="pos-btn" data-pos="지원가"><img src="/icons/support.png" class="pos-icon" onerror="this.style.display='none'">지원가</button>
                </div>
            </div>
            <p class="err" id="err"></p>
            <button type="button" class="submit-btn" id="submit-btn">참가 신청</button>
        </div>
    </div>

    <div id="admin-banner" style="display:none;margin-bottom:1rem">
        <a id="admin-link" href="#" class="manage-link" style="display:block;text-align:center;background:#0f3460;border-color:#e94560;color:#e0e0f0">
            ⚙️ 내전 관리자 페이지 열기
        </a>
    </div>

    <div class="success" id="success">
        <h2 id="success-title">✅ 참가 신청 완료!</h2>
        <p id="success-msg">참가 신청이 성공적으로 접수되었습니다.</p>
        <a href="#" id="manage-link" class="manage-link">✏️ 수정 / 취소하기</a>
    </div>
</div>

<p style="background:rgba(233,69,96,.12);border:1px solid #e94560;border-radius:8px;color:#e0e0f0;font-size:.85rem;text-align:center;padding:.6rem 1rem;margin-top:1.5rem">페이지가 정상적으로 표시되지 않으면 <strong style="color:#e94560">Ctrl+Shift+R</strong> 로 새로고침해주세요.</p>

<script>
    const params    = new URLSearchParams(location.search);
    const eventId   = params.get('event');
    const editToken = params.get('token');
    const discordId = params.get('discord_id');
    let selectedPos   = '';
    let selectedTier  = '';
    let isLonewolf    = false;
    let selectedChars = [];
    let lookedUpMmr   = null;

    const CHARACTERS = ['재키','아야','현우','매그너스','피오라','나딘','자히르','하트','아이솔','리 다이린','유키','혜진','쇼우','시셀라','키아라','아드리아나','쇼이치','실비아','엘마','레녹스','로지','루크','캐시','아델라','버니스','바바라','알렉스','수아','레온','일레븐','리오','윌리엄','니키','나타폰','안','이바','다니엘','제니','카밀로','클로에','요한','비앙카','셀린','에키온','마이','에이든','라우라','띠아','펠릭스','엘레나','프리야','아디나','마커스','칼라','에스텔','피올로','마르티나','헤이즈','아이작','타지아','이렘','테오도르','이안','바냐','데비&마를렌','아르다','아비게일','알론소','레니','초바메','케네스','카티야','샬럿','다르코','르노어','가넷','유민','히스이','유스티나','아슈트반','니아','슈린','헨리','블레어','미르카','펜리르','코렐라인','비형'];
    const DAK_VER = '11.5.0';
    const CHAR_EN = {'재키':'Jackie','아야':'Aya','현우':'Hyunwoo','매그너스':'Magnus','피오라':'Fiora','나딘':'Nadine','자히르':'Zahir','하트':'Hart','아이솔':'Isol','리 다이린':'LiDailin','유키':'Yuki','혜진':'Hyejin','쇼우':'Xiukai','시셀라':'Sissela','키아라':'Chiara','아드리아나':'Adriana','쇼이치':'Shoichi','실비아':'Silvia','엘마':'Emma','레녹스':'Lenox','로지':'Rozzi','루크':'Luke','캐시':'Cathy','아델라':'Adela','버니스':'Bernice','바바라':'Barbara','알렉스':'Alex','수아':'Sua','레온':'Leon','일레븐':'Eleven','리오':'Rio','윌리엄':'William','니키':'Nicky','나타폰':'Nathapon','안':'Jan','이바':'Eva','다니엘':'Daniel','제니':'Jenny','카밀로':'Camilo','클로에':'Chloe','요한':'Johann','비앙카':'Bianca','셀린':'Celine','에키온':'Echion','마이':'Mai','에이든':'Aiden','라우라':'Laura','띠아':'Tia','펠릭스':'Felix','엘레나':'Elena','프리야':'Priya','아디나':'Adina','마커스':'Markus','칼라':'Karla','에스텔':'Estelle','피올로':'Piolo','마르티나':'Martina','헤이즈':'Haze','아이작':'Isaac','타지아':'Tazia','이렘':'Irem','테오도르':'Theodore','이안':'Lyanh','바냐':'Vanya','데비&마를렌':'DebiMarlene','아르다':'Arda','아비게일':'Abigail','알론소':'Alonso','레니':'Leni','초바메':'Tsubame','케네스':'Kenneth','카티야':'Katja','샬럿':'Charlotte','다르코':'Darko','르노어':'Lenore','가넷':'Garnet','유민':'YuMin','히스이':'Hisui','유스티나':'Justyna','아슈트반':'Istvan','니아':'Niah','슈린':'Xuelin','헨리':'Henry','블레어':'Blair','미르카':'Mirka','펜리르':'Fenrir','코렐라인':'Coraline','비형':'Bihyung'};

    function charImg(name) {
        const en = CHAR_EN[name];
        if (!en) return '';
        return `<img src="https://cdn.dak.gg/assets/er/game-assets/${DAK_VER}/CharCommunity_${en}_S000.png" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;margin:0 auto .12rem" onerror="this.remove()">`;
    }

    function renderCharGrid(query) {
        const filtered = CHARACTERS.filter(c => c.includes(query));
        const el = document.getElementById('char-grid');
        el.innerHTML = filtered.map(c => {
            const sel = selectedChars.includes(c);
            const maxed = !sel && selectedChars.length >= 3;
            return `<div class="char-pick${sel?' selected':''}${maxed?' maxed':''}" onclick="toggleChar('${c}')">${charImg(c)}${c}</div>`;
        }).join('') || '<div style="color:var(--muted);font-size:.82rem;grid-column:1/-1;text-align:center;padding:.4rem">검색 결과 없음</div>';
    }

    function renderCharChips() {
        const el = document.getElementById('char-chips');
        if (!selectedChars.length) {
            el.innerHTML = '<span style="color:var(--muted);font-size:.83rem">선택 없음</span>';
        } else {
            el.innerHTML = selectedChars.map(c =>
                `<span class="char-chip">${charImg(c).replace('display:block','display:inline-block').replace('margin:0 auto .12rem','vertical-align:middle;margin-right:.25rem')}${c}<span class="char-chip-x" onclick="toggleChar('${c}')">✕</span></span>`
            ).join('');
        }
        document.getElementById('char-hint').textContent =
            selectedChars.length >= 3 ? '최대 3개 선택됨.' : `최대 3개까지 선택할 수 있어요. (현재 ${selectedChars.length}개)`;
        document.getElementById('char-toggle-btn').textContent =
            selectedChars.length ? `실험체 선택 변경 (${selectedChars.length}/3)` : '+ 실험체 선택';
    }

    function toggleChar(c) {
        if (selectedChars.includes(c)) {
            selectedChars = selectedChars.filter(x => x !== c);
        } else {
            if (selectedChars.length >= 3) return;
            selectedChars.push(c);
        }
        renderCharGrid(document.getElementById('char-search').value);
        renderCharChips();
    }

    function toggleCharPicker() {
        const picker = document.getElementById('char-picker');
        const shown = picker.style.display !== 'none';
        picker.style.display = shown ? 'none' : 'block';
        if (!shown) {
            const inp = document.getElementById('char-search');
            inp.value = '';
            renderCharGrid('');
            inp.focus();
        }
    }

    document.getElementById('char-search').addEventListener('input', e => renderCharGrid(e.target.value));

    async function lookupTier() {
        const nick = document.getElementById('in').value.trim();
        if (!nick) return;
        const btn = document.getElementById('lookup-btn');
        const box = document.getElementById('mmr-result');
        btn.disabled = true;
        btn.textContent = '조회 중...';
        box.style.display = 'none';
        box.className = 'mmr-result';
        try {
            const r = await fetch(`/api/lookup-tier?nickname=${encodeURIComponent(nick)}`);
            const d = await r.json();
            if (d.tier) {
                lookedUpMmr = d.mmr;
                selectTier(d.tier);
                const rankTxt = d.rank ? ` · ${d.rank}위` : '';
                box.textContent = `✅ ${d.tier} · MMR ${d.mmr}${rankTxt} (자동 선택됨)`;
                box.className = 'mmr-result ok';
            } else {
                box.textContent = `❌ ${d.error || '유저를 찾을 수 없어요.'}`;
                box.className = 'mmr-result fail';
            }
        } catch {
            box.textContent = '❌ 조회 중 오류가 발생했어요.';
            box.className = 'mmr-result fail';
        }
        box.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '티어 조회';
    }

    document.getElementById('in').addEventListener('input', () => {
        lookedUpMmr = null;
        document.getElementById('mmr-result').style.display = 'none';
    });

    const TIER_IMG = {
        '언랭크': null,
        '아이언': 'https://cdn.dak.gg/er/images/tier/full/1.png',
        '브론즈': 'https://cdn.dak.gg/er/images/tier/full/2.png',
        '실버':   'https://cdn.dak.gg/er/images/tier/full/3.png',
        '골드':   'https://cdn.dak.gg/er/images/tier/full/4.png',
        '플래티넘': 'https://cdn.dak.gg/er/images/tier/full/5.png',
        '다이아몬드': 'https://cdn.dak.gg/er/images/tier/full/6.png',
        '메테오라이트': 'https://cdn.dak.gg/er/images/tier/full/63.png',
        '미스릴': 'https://cdn.dak.gg/er/images/tier/full/66.png',
        '데미갓': 'https://cdn.dak.gg/er/images/tier/full/7.png',
        '이터니티': 'https://cdn.dak.gg/er/images/tier/full/8.png',
    };

    if (eventId) {
        Promise.all([
            fetch(`/api/event-info?event=${eventId}`).then(r => r.json()).catch(() => ({})),
            discordId ? fetch(`/api/is-admin?event=${eventId}&discord_id=${discordId}`).then(r => r.json()).catch(() => ({})) : Promise.resolve({})
        ]).then(([info, adminInfo]) => {
            if (info.gameType === '론울프') {
                isLonewolf = true;
                document.getElementById('position-field').style.display = 'none';
            }
            if (info.rule) {
                document.getElementById('rule-text').textContent = info.rule;
                document.getElementById('rule-box').style.display = 'block';
            }
            if (adminInfo.isAdmin) {
                document.getElementById('admin-link').href = adminInfo.adminUrl;
                document.getElementById('admin-banner').style.display = 'block';
            }
        });
    }

    if (editToken) {
        document.getElementById('page-title').textContent = '✏️ 참가 정보 수정';
        document.getElementById('submit-btn').textContent = '수정하기';
        fetch(`/api/participant?token=${editToken}`)
            .then(r => r.json())
            .then(d => {
                if (d.discord_nickname) document.getElementById('dn').value = d.discord_nickname;
                if (d.ingame_nickname)  document.getElementById('in').value = d.ingame_nickname;
                if (d.position) selectPos(d.position);
                if (d.tier)     selectTier(d.tier);
                if (d.main_characters?.length) {
                    selectedChars = d.main_characters.slice(0, 3);
                    renderCharChips();
                }
            }).catch(() => {});
    }

    document.querySelectorAll('.pos-btn:not(.tier-btn)').forEach(btn => {
        btn.addEventListener('click', () => selectPos(btn.dataset.pos));
    });
    document.querySelectorAll('.tier-btn').forEach(btn => {
        btn.addEventListener('click', () => selectTier(btn.dataset.tier));
    });

    function selectPos(pos) {
        selectedPos = pos;
        document.querySelectorAll('.pos-btn:not(.tier-btn)').forEach(b => b.classList.toggle('on', b.dataset.pos === pos));
    }
    function selectTier(tier) {
        selectedTier = (selectedTier === tier) ? '' : tier;
        document.querySelectorAll('.tier-btn').forEach(b => b.classList.toggle('on', b.dataset.tier === selectedTier));
    }

    document.getElementById('submit-btn').addEventListener('click', async () => {
        const dn  = document.getElementById('dn').value.trim();
        const inn = document.getElementById('in').value.trim();
        const err = document.getElementById('err');

        if (!dn || !inn || (!isLonewolf && !selectedPos)) {
            err.textContent = isLonewolf ? '닉네임을 입력해주세요.' : '모든 항목을 입력해주세요.';
            err.style.display = 'block';
            return;
        }
        err.style.display = 'none';

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = '처리 중...';

        const body = new URLSearchParams({ event: eventId, discord_nickname: dn, ingame_nickname: inn, position: selectedPos });
        if (selectedTier)  body.append('tier', selectedTier);
        if (lookedUpMmr)   body.append('mmr', lookedUpMmr);
        if (editToken)     body.append('token', editToken);
        if (discordId)     body.append('discord_id', discordId);
        for (const c of selectedChars) body.append('main_characters', c);

        try {
            const res  = await fetch('/join', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
            const data = await res.json();
            if (data.success) {
                document.getElementById('form-wrap').style.display = 'none';
                const sc = document.getElementById('success');
                sc.style.display = 'block';
                document.getElementById('manage-link').href = `/cancel?token=${data.cancel_token}`;
                if (data.updated) {
                    document.getElementById('success-title').textContent = '✅ 수정 완료!';
                    document.getElementById('success-msg').textContent = '참가 정보가 업데이트되었습니다.';
                }
            } else {
                err.textContent = data.error || '오류가 발생했습니다.';
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = editToken ? '수정하기' : '참가 신청';
            }
        } catch (e) {
            err.textContent = '서버 오류가 발생했습니다.';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = editToken ? '수정하기' : '참가 신청';
        }
    });
</script>
</body>
</html>
